name: Upstream Drift

# Assumptions about somebody else's release process can break without a commit
# to this repository, so unit tests can never catch them. This runs on a
# schedule against the real APIs and opens an issue when something we depend on
# has changed.
#
# It exists because of a concrete failure: the vtctldclient installer built its
# download URL from parts while the real asset embeds a release commit, so every
# install 404'd, and the unit tests passed throughout because they asserted the
# script's text rather than that the URL resolved.

on:
  schedule:
    # Weekly. Release-process changes are rare, and a daily run mostly spends
    # API budget confirming nothing moved.
    - cron: '0 6 * * 1'
  workflow_dispatch:
  # Also on changes to the code that encodes these assumptions, so a mistake is
  # caught on the pull request that introduces it rather than the next Monday.
  pull_request:
    paths:
      - 'packages/ts-cloud/src/deploy/dashboard-vitess.ts'
      - 'scripts/check-vitess-upstream.ts'
      - '.github/workflows/upstream-drift.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-drift
  cancel-in-progress: true

jobs:
  vitess:
    name: Vitess release assumptions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check Vitess upstream
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          bun scripts/check-vitess-upstream.ts 2>&1 | tee /tmp/vitess-drift.log

      - name: Report drift
        # Only on the scheduled run: a pull request already shows the failure
        # in its own checks, and filing an issue there would be noise.
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let log = ''
            try { log = fs.readFileSync('/tmp/vitess-drift.log', 'utf8') } catch {}

            const title = 'Vitess upstream drift: installer or recipe assumptions broken'
            const body = [
              'The scheduled upstream check failed. Something Vitess publishes has changed,',
              'which means `vtctldclient` installs and/or the `vitess.io` pantry build are',
              'broken for everyone until it is fixed.',
              '',
              '```',
              log.slice(0, 60000),
              '```',
              '',
              `[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n')

            // Reuse an open issue rather than filing one per week, so a
            // long-standing break stays a single thread.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-drift',
            })

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['upstream-drift'],
              })
            }
